name: CI

on:
  push:
    branches: [main, master, deploy]
  pull_request:
    branches: [main, master, deploy]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test
